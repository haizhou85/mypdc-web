# 手动检查队伍库里某个队伍的数据（结果显示在运行记录的注释里）
name: 检查队伍库数据
on:
  workflow_dispatch:
    inputs:
      id:
        description: 队伍编号
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=$(curl -s "https://mypdc-teams.haizhou-guo.workers.dev/api/teams/${{ inputs.id }}" | head -c 3000)
          echo "::notice title=队伍 ${{ inputs.id }}::$R"
          L=$(curl -s "https://mypdc-teams.haizhou-guo.workers.dev/api/teams?limit=5" | head -c 3000)
          echo "::notice title=列表::$L"
          for u in https://lalapad.pages.dev/ https://lalapad.pages.dev/solo.html https://lalapad.pages.dev/mypdc-config.js; do
            echo "::notice title=$u::$(curl -s -o /tmp/b -w '%{http_code} %{url_effective}' -L "$u") $(head -c 200 /tmp/b | tr '\n' ' ')"
          done
          C=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://lalapad.pages.dev' -D - "https://mypdc-teams.haizhou-guo.workers.dev/api/teams?limit=1" | grep -i access-control-allow-origin | tr -d '\r')
          echo "::notice title=CORS::$C"
